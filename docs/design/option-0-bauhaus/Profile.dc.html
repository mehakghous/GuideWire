<a href="New.dc.html" style="display:flex;align-items:center;gap:12px;padding:13px 24px;color:#111;text-decoration:none;font-size:18px;font-weight:500;border-top:1px solid #111"><span style="width:10px;height:10px;border:2px solid #111;box-sizing:border-box"></span>new tutorial</a>

<main style="flex:1;min-width:0;box-sizing:border-box;padding:36px 40px;display:flex;flex-direction:column;gap:28px">
<h1 style="margin:0;font-size:52px;line-height:0.96;font-weight:800;letter-spacing:-0.025em">your<br>profile.</h1>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:4px solid #111">
<form style="padding:24px;display:flex;flex-direction:column;gap:22px;min-width:0">
<div style="font-size:22px;font-weight:800">name and look</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="dn" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase">display name</label>
<input id="dn" type="text" value="Demo Learner" style="border:0;border-bottom:3px solid #111;background:transparent;font:500 21px 'Jost',sans-serif;padding:6px 0;color:#111;outline:none">
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase">theme</span>
<div style="display:flex;gap:12px">
<div style="flex:1;border:4px solid #D92B14;background:#F2F1EC;padding:14px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;gap:6px"><span style="width:14px;height:14px;border-radius:50%;background:#D92B14"></span><span style="width:14px;height:14px;background:#111"></span></div>
<span style="font-size:17px;font-weight:800">light</span>
</div>
<div style="flex:1;border:4px solid #111;background:#121212;color:#F2F1EC;padding:14px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;gap:6px"><span style="width:14px;height:14px;border-radius:50%;background:#FF5A3D"></span><span style="width:14px;height:14px;background:#F2F1EC"></span></div>
<span style="font-size:17px;font-weight:800">dark</span>
</div>
</div>
</div>
<label for="ov" style="display:flex;align-items:center;gap:10px;font-size:16px"><input id="ov" type="checkbox" checked style="width:18px;height:18px;accent-color:#111">show the on-screen highlight during sessions</label>
<a href="Profile.dc.html" style="align-self:flex-start;background:#D92B14;color:#fff;text-decoration:none;font-weight:800;font-size:17px;padding:12px 22px">save changes</a>
</form>
<form style="padding:24px;display:flex;flex-direction:column;gap:22px;min-width:0;border-left:4px solid #111">
<div style="font-size:22px;font-weight:800">password</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="old" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase">current password</label>
<input id="old" type="password" value="guidewire-demo" style="border:0;border-bottom:3px solid #111;background:transparent;font:500 21px 'Jost',sans-serif;padding:6px 0;color:#111;outline:none">
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="new" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase">new password, 8 characters or more</label>
<input id="new" type="password" value="" style="border:0;border-bottom:3px solid #111;background:transparent;font:500 21px 'Jost',sans-serif;padding:6px 0;color:#111;outline:none">
</div>
<a href="Profile.dc.html" style="align-self:flex-start;border:3px solid #111;color:#111;text-decoration:none;font-weight:800;font-size:17px;padding:9px 20px">change password</a>
<div style="font-size:14px;line-height:1.45;color:#6B6B66;margin-top:auto">passwords are hashed on this computer.</div>
