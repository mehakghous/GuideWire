name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: No secrets or local data are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$|^local_data/|^runs/|\.sqlite$'; then echo "tracked secret/local/build file found"; exit 1; fi

      - name: Lint (syntax errors, undefined names, unused imports and variables)
        run: ruff check .

      - name: Tests (offline; live API tests are deselected by pytest.ini)
        run: python -m pytest -q -rs

      - name: Frozen evaluation files still match their recorded hashes
        run: python -m pytest -q tests/test_kb.py::test_held_out_sets_are_frozen tests/test_scenarios_e2e.py::test_follow_up_heldout_set_is_frozen_and_currently_passes tests/test_service.py -k "frozen"
